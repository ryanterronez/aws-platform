name: Terraform apply

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "*.tf"
      - "**/*.tf"
      - "*.tf.json"
      - "**/*.tf.json"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform-*.yml"
      - ".github/workflows/terraform-*.yaml"

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  terraform:
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: us-east-2
      TF_VAR_terraform_state_bucket_name: areopagus-terraform-state

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.0

      - name: Report Terraform formatting issues
        run: |
          if ! terraform fmt -check; then
            echo "::warning::Terraform formatting is needed. Run 'terraform fmt -recursive' locally."
          fi

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::503353372972:role/terraform-apply
          role-session-name: github-actions-terraform-apply-${{ github.run_id }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Apply Terraform changes
        run: terraform apply -input=false -auto-approve -no-color
