name: Terraform pull request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "*.tf"
      - "**/*.tf"
      - "*.tf.json"
      - "**/*.tf.json"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform-*.yml"
      - ".github/workflows/terraform-*.yaml"

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform:
    # Fork pull requests must not receive an AWS OIDC token or AWS credentials.
    if: github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: us-east-2

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.0

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Display GitHub OIDC token claims
        shell: bash
        run: |
          oidc_token="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq --raw-output '.value')"

          OIDC_TOKEN="$oidc_token" node <<'NODE'
          const claims = JSON.parse(
            Buffer.from(process.env.OIDC_TOKEN.split(".")[1], "base64url").toString("utf8"),
          );
          const allowedClaims = [
            "sub",
            "aud",
            "repository",
            "repository_id",
            "repository_owner",
            "repository_owner_id",
          ];
          console.log(JSON.stringify(
            Object.fromEntries(allowedClaims.map((claim) => [claim, claims[claim]])),
            null,
            2,
          ));
          NODE

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::503353372972:role/github-actions-oidc
          role-session-name: github-actions-terraform-pr-${{ github.run_id }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Create Terraform plan
        run: terraform plan -input=false -no-color

  checkov:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12.3123.0
        with:
          directory: .
          framework: terraform
